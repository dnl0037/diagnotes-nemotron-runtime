name: Build private runtime candidates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: candidate-${{ matrix.backend }}
    runs-on: windows-2022
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, cuda]
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout recipe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Record runner
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber | ConvertTo-Json
          "ImageOS=$env:ImageOS"
          "ImageVersion=$env:ImageVersion"

      - name: Prove structured gates before build network
        shell: pwsh
        run: |
          .\scripts\Test-RuntimeGates.ps1 -EvidencePath ".\artifacts\evidence-${{ matrix.backend }}\gates-preflight.json"
          .\scripts\Test-RuntimeRecipe.ps1 -EvidencePath ".\artifacts\evidence-${{ matrix.backend }}\recipe-preflight.json"

      - name: Prove sanitizer before CUDA
        if: ${{ matrix.backend == 'cuda' }}
        shell: pwsh
        run: |
          .\scripts\Test-BuildRuntimeHelpers.ps1 -BuildScriptPath .\scripts\Build-Runtime.ps1 -EvidencePath .\artifacts\sanitizer-preflight\sanitizer-preflight.json

      - name: Build candidate bytes once
        id: build
        shell: pwsh
        run: |
          .\scripts\Build-Runtime.ps1 -Backend '${{ matrix.backend }}' -Configuration Release -CudaArch '75;80;86;89' -CudaVersion '12.8'
          $zips = @(Get-ChildItem -LiteralPath .\artifacts -File -Filter '*.zip')
          if ($zips.Count -ne 1) { throw "Build produced $($zips.Count) ZIPs; expected exactly one." }
          $zip = $zips[0]
          $expected = if ('${{ matrix.backend }}' -eq 'cpu') {
            'nemo-speech-v0.1.0-diagnotes-lid.3-windows-x86_64-cpu.zip'
          } else {
            'nemo-speech-v0.1.0-diagnotes-lid.3-windows-x86_64-cuda-sm75-sm80-sm86-sm89.zip'
          }
          if ($zip.Name -ne $expected) { throw "Unexpected ZIP name: $($zip.Name)" }
          $gateResults = Resolve-Path -LiteralPath ".\artifacts\evidence-${{ matrix.backend }}\gate-results.json"
          "zip_path=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "zip_name=$($zip.Name)" >> $env:GITHUB_OUTPUT
          "gate_results=$($gateResults.Path)" >> $env:GITHUB_OUTPUT
          Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256

      - name: Attest exact candidate bytes
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: ${{ steps.build.outputs.zip_path }}
          show-summary: false

      - name: Verify attestation subject and finalize gates
        id: verify
        if: ${{ always() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $verificationPath = ".\artifacts\evidence-${{ matrix.backend }}\attestation-verification.json"
          $verifyArgs = @('attestation','verify','${{ steps.build.outputs.zip_path }}','--repo',$env:GITHUB_REPOSITORY,'--signer-workflow',"github.com/$env:GITHUB_REPOSITORY/.github/workflows/build-release.yml",'--source-digest',$env:GITHUB_SHA,'--format','json')
          $verifyOutput = (& gh @verifyArgs 2>&1 | Out-String)
          $verifyExit = $LASTEXITCODE
          if ($verifyExit -eq 0) { [IO.File]::WriteAllText($verificationPath, $verifyOutput, [Text.UTF8Encoding]::new($false)) }
          else { [IO.File]::WriteAllText($verificationPath, '[]', [Text.UTF8Encoding]::new($false)) }
          [ordered]@{ schema='diagnotes-attestation-command-v1'; exit_code=$verifyExit } | ConvertTo-Json | Set-Content -LiteralPath ".\artifacts\evidence-${{ matrix.backend }}\attestation-command.json" -Encoding utf8NoBOM
          .\scripts\Test-RuntimeGates.ps1 -Mode FinalizeAttestation -GateResultsPath '${{ steps.build.outputs.gate_results }}' -ZipPath '${{ steps.build.outputs.zip_path }}' -VerificationPath $verificationPath
          $final = Get-Content -LiteralPath '${{ steps.build.outputs.gate_results }}' -Raw | ConvertFrom-Json -Depth 30
          $notGreen = @($final.gates | Where-Object status -ne 'PASS')
          if ($notGreen.Count -ne 0) { throw "Final candidate gate record is not fully green: $($notGreen.id -join ', ')" }

      - name: Upload sanitized build evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-evidence-${{ matrix.backend }}-${{ github.run_id }}
          path: artifacts/evidence-${{ matrix.backend }}/**
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Upload sanitizer preflight evidence
        if: ${{ always() && matrix.backend == 'cuda' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sanitizer-preflight-${{ matrix.backend }}-${{ github.run_id }}
          path: artifacts/sanitizer-preflight/sanitizer-preflight.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Upload attested private candidate
        if: ${{ success() && steps.verify.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ matrix.backend }}-${{ github.run_id }}
          path: ${{ steps.build.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
